<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Doceria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f4f4f4; padding: 20px; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { width: 100%; max-width: 450px; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { color: #EA1D2C; margin-bottom: 20px; font-size: 22px; text-align: center; }
        input, select, button, textarea { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        label { font-size: 12px; font-weight: bold; color: #777; margin-top: 15px; display: block; }
        button { background: #EA1D2C; color: #fff; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { background: #c01724; }
        .item-lista { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .item-info { display: flex; align-items: center; gap: 10px; }
        .item-info img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
        .btns { display: flex; gap: 8px; }
        .btn-del { background: #fff; color: #EA1D2C; border: 1px solid #EA1D2C; width: auto; padding: 5px 10px; font-size: 11px; }
        .btn-edit { background: #333; color: #fff; width: auto; padding: 5px 10px; font-size: 11px; }
        #preview { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #eee; }
        .divisor-ou { text-align: center; font-size: 10px; color: #bbb; margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="painel-admin" class="box">
        <div style="display: flex; justify-content: center; align-items: center;">
            <h2 id="tituloForm">Gerenciar Doceria</h2>
        </div>
        
        <input type="hidden" id="idAtual">
        
        <label>NOME DO DOCE</label>
        <input type="text" id="nome" placeholder="Ex: Bolo de Pote Ninho com Nutella">
        
        <label>DESCRIÇÃO</label>
        <textarea id="descricao" placeholder="Descreva os ingredientes e tamanho..." style="height: 80px; resize: none;"></textarea>
        
        <label>PREÇO (R$)</label>
        <input type="number" id="preco" placeholder="0.00" step="0.01">
        
        <label>CATEGORIA</label>
        <select id="categoria">
            <option value="bolo-pote">Bolo de Pote</option>
            <option value="copo-felicidade">Copo da Felicidade</option>
            <option value="mini-vulcao">Mini Bolo Vulcão</option>
            <option value="travessa">Sobremesa na Travessa</option>
        </select>
        
        <label>IMAGEM (ARQUIVO)</label>
        <input type="file" id="inputArquivo" accept="image/*">
        
        <div class="divisor-ou">OU</div>
        
        <label>IMAGEM (LINK/URL)</label>
        <input type="text" id="linkImagem" placeholder="Cole o link da imagem aqui...">
        
        <img id="preview" src="">
        <input type="hidden" id="imagemUrl">

        <button id="addBtn">Salvar Produto</button>
        <button id="cancelBtn" style="display:none; background:#999;">Cancelar Edição</button>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">
        <h3 style="font-size: 16px;">Doces Cadastrados</h3>
        <div id="lista"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFGIotXXUF9VeGDXFyDwvSK_jOYnAsEto",
            authDomain: "doceria-a6b78.firebaseapp.com",
            projectId: "doceria-a6b78",
            storageBucket: "doceria-a6b78.firebasestorage.app",
            messagingSenderId: "55759390724",
            appId: "1:55759390724:web:3c5daa7ae439acb10f0d51",
            measurementId: "G-J474127H6F"
        };

        const CLOUD_NAME = "dshhehb3n";
        const UPLOAD_PRESET = "marmita";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ref = collection(db, "produtos");

        const addBtn = document.getElementById('addBtn');
        const inputArquivo = document.getElementById('inputArquivo');
        const linkImagem = document.getElementById('linkImagem');
        const preview = document.getElementById('preview');
        const imagemUrl = document.getElementById('imagemUrl');

        // Preview de Arquivo Carregado
        inputArquivo.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                linkImagem.value = ""; // Limpa o link se escolher arquivo
                const reader = new FileReader();
                reader.onloadend = () => { 
                    preview.src = reader.result; 
                    preview.style.display = "block"; 
                };
                reader.readAsDataURL(file);
            }
        };

        // Preview de Link Colado
        linkImagem.oninput = () => {
            if (linkImagem.value.trim() !== "") {
                inputArquivo.value = ""; // Limpa o arquivo se colar link
                preview.src = linkImagem.value;
                preview.style.display = "block";
            } else {
                preview.style.display = "none";
            }
        };
		

        async function subirParaCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            return data.secure_url.replace('/upload/', '/upload/f_auto,q_auto,w_600/');
        }
		
		document.getElementById('cancelBtn').onclick = (e) => {
            e.preventDefault();
            window.limparForm();
        };

        addBtn.onclick = async () => {
            const id = document.getElementById('idAtual').value;
            const file = inputArquivo.files[0];
            const urlManual = linkImagem.value.trim();
            let urlFinal = imagemUrl.value;

            if(!document.getElementById('nome').value || !document.getElementById('preco').value) {
                return alert("Nome e preço obrigatórios!");
            }
			

            addBtn.innerText = "Salvando...";
            addBtn.disabled = true;

            // Lógica de escolha da imagem:
            // 1. Se houver um novo arquivo, sobe pro Cloudinary
            // 2. Se não houver arquivo mas houver um link manual, usa o link
            // 3. Se for edição e nada mudou, mantém a urlFinal que já estava
            if (file) {
                urlFinal = await subirParaCloudinary(file);
            } else if (urlManual !== "") {
                urlFinal = urlManual;
            }

            const dados = {
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                preco: document.getElementById('preco').value,
                categoria: document.getElementById('categoria').value,
                imagem: urlFinal
            };

            try {
                if(id) await updateDoc(doc(db, "produtos", id), dados);
                else await addDoc(ref, dados);
                window.limparForm();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar produto.");
            }

            addBtn.innerText = "Salvar Produto";
            addBtn.disabled = false;
        };

        onSnapshot(ref, (snap) => {
            const lista = document.getElementById('lista');
            lista.innerHTML = '';
            snap.forEach(d => {
                const p = d.data();
                lista.innerHTML += `
                    <div class="item-lista">
                        <div class="item-info">
                            <img src="${p.imagem || 'https://via.placeholder.com/50'}">
                            <span><strong>${p.nome}</strong><br><small>R$ ${p.preco}</small></span>
                        </div>
                        <div class="btns">
                            <button class="btn-edit" onclick="prepararEdicao('${d.id}', \`${p.nome}\`, \`${p.descricao || ''}\`, '${p.preco}', '${p.categoria}', '${p.imagem}')">Editar</button>
                            <button class="btn-del" onclick="apagar('${d.id}')">Excluir</button>
                        </div>
                    </div>
                `;
            });
        });

        window.prepararEdicao = (id, nome, desc, preco, cat, img) => {
            document.getElementById('idAtual').value = id;
            document.getElementById('nome').value = nome;
            document.getElementById('descricao').value = desc;
            document.getElementById('preco').value = preco;
            document.getElementById('categoria').value = cat;
            
            imagemUrl.value = img;
            linkImagem.value = img; // Preenche o campo de link com a URL atual
            inputArquivo.value = "";
            
            preview.src = img;
            preview.style.display = img ? "block" : "none";
            
            document.getElementById('tituloForm').innerText = "Editando Doce";
            addBtn.innerText = "Atualizar";
            document.getElementById('cancelBtn').style.display = "block";
            
            // ADICIONE ESTA LINHA:
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.limparForm = () => {
            document.getElementById('idAtual').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('descricao').value = '';
            document.getElementById('preco').value = '';
            document.getElementById('imagemUrl').value = '';
            document.getElementById('linkImagem').value = '';
            inputArquivo.value = '';
            preview.style.display = "none";
            document.getElementById('tituloForm').innerText = "Gerenciar Doceria";
            addBtn.innerText = "Salvar Produto";
            document.getElementById('cancelBtn').style.display = "none";
        };

        window.apagar = async (id) => { if(confirm("Excluir produto?")) await deleteDoc(doc(db, "produtos", id)); };
    </script>
</body>
</html>
